<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Product Card</title>

    <style>
      body{
        background: #f5f5f5;
        font-family: Arial;
      }
      .product{
        width: 320px;
        margin: 50px auto;
        background: white;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 12px;
      }
      .product img{
        width: 100%;
      }
      .product h2{
        text-align: center;
      }
      .price{
        color:red;
        font-weight: bold;
      }
      button{
        background: blue;
        color:white;
         border: none;
        padding: 10px 20px;
      }
      button:hover{
        background: darkblue;
      }
    </style>
</head>
<body>  
    <div class="product">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRo4HQo3xzceOoe4FXjGht1Zq61dF46aP2hNKCpRSo7XRX6W7chrwdUBBc&s=10" alt="Sản phẩm">
        <h2>Áo thể thao</h2>
        <p>Áo thể thao, chất liệu vải cottong thoáng mát</p>
        <p class="price">250.000 VNĐ</p>
        <button>Mua ngay</button>
    </div>
    <div class="product">
        <img src="https://www.sporter.vn/wp-content/uploads/2017/06/Ao-bong-da-barca-san-nha-2526-1-2.png" alt="Sản phẩm">
        <h2>Áo thể thao</h2>
        <p>Áo thể thao Brazil</p>
        <p class="price">250.000 VNĐ</p>
        <button>Mua ngay</button>
    </div>
    <div class="product">
        <img src="https://down-vn.img.susercontent.com/file/vn-11134207-7r98o-lvbo3f0o0bd92d" alt="Sản phẩm">
        <h2>Giày đá bóng </h2>
        <p>Giày đá bóng cổ cao </p>
        <p class="price"> 200.000 VNĐ</p>
        <button>Mua ngay</button>
    </div>
</body>
</html>
